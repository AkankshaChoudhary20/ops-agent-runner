services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-ops-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_ops_builder
    ports:
      - "5435:5432"
    volumes:
      - agentic_ops_builder_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_ops_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentic_ops_builder_pgdata:
